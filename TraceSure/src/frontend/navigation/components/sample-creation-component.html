    <div class="container-2-sample-creation-form">
        <div class="sample-creation-form-hidden" id="sample-creation-form">
            <div class="container-2-sample-name-input">
                <input type="text" id="sample-name-input" placeholder="Enter sample name">
            </div>
            <div class="test-selection">
                <label><input type="checkbox" value="identification"> Identification</label>
                <label><input type="checkbox" value="assay"> Assay</label>
                <label><input type="checkbox" value="dissolution"> Dissolution</label>
                <label><input type="checkbox" value="content_uniformity"> Content Uniformity</label>
                <label><input type="checkbox" value="individual_impurity"> Individual Impurity</label>
                <label><input type="checkbox" value="total_impurities"> Total Impurities</label>
                <label><input type="checkbox" value="microbial_limit_TAMC">Microbial Limit TAMC</label>
                <label><input type="checkbox" value="microbial_limit_TYMC">Microbial Limit TYMC</label>
                <label><input type="checkbox" value="water_content"> Water Content</label>
            </div>
            <div class="sample-creation-complete-btn">
                <button id="sample-creation-complete">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-stack-overflow" viewBox="0 0 16 16">
                        <path d="M12.412 14.572V10.29h1.428V16H1v-5.71h1.428v4.282z"/>
                        <path d="M3.857 13.145h7.137v-1.428H3.857zM10.254 0 9.108.852l4.26 5.727 1.146-.852zm-3.54 3.377 5.484 4.567.913-1.097L7.627 2.28l-.914 1.097zM4.922 6.55l6.47 3.013.603-1.294-6.47-3.013zm-.925 3.344 6.985 1.469.294-1.398-6.985-1.468z"/>

                    <span>Create Sample</span>
                </button>
            </div>
        </div>
        <div class="container-2-add-test-form-hidden" id="container-2-add-test-form">
            <div class="add-test-form-top-bar">
                <input type="text" id="add-test-sample-name" placeholder="Enter sample name">
                <button id="add-test-search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M11 6a5 5 0 1 1-1.001-9.999A5 5 0 0 1 11 6zm-1.293 4.707a1 1 0 0 1-1.414 0L6 8.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L4.586 7 2.293 4.707a1 1 0 0 1 1.414-1.414L6 5.586l2.293-2.293a1 1 0 0 1 1.414 1.414L7.414 7l2.293 2.293a1 1 0 0 1 0 1.414z"/>
                    </svg>
                    <span>Search</span>
                </button>
            </div>
            <div id="add-test-form-display"></div>
            <div class="add-test-form-display-additional-tests-hidden" id="add-test-form-display-additional-tests">
                <p style="font-weight:bold; font-size:20px;">Select Missing Tests</p>
                <div class="test-addition">
                    <label><input type="checkbox" value="identification"> Identification</label>
                    <label><input type="checkbox" value="assay"> Assay</label>
                    <label><input type="checkbox" value="dissolution"> Dissolution</label>
                    <label><input type="checkbox" value="content_uniformity"> Content Uniformity</label>
                    <label><input type="checkbox" value="individual_impurity"> Individual Impurity</label>
                    <label><input type="checkbox" value="total_impurities"> Total Impurities</label>
                    <label><input type="checkbox" value="microbial_limit_TAMC">Microbial Limit TAMC</label>
                    <label><input type="checkbox" value="microbial_limit_TYMC">Microbial Limit TYMC</label>
                    <label><input type="checkbox" value="water_content"> Water Content</label>
                </div>
                <button id="add-test-form-submission">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-back" viewBox="0 0 16 16">
                        <path d="M0 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1z"/>
                    </svg>
                    <span>Submit</span>
                </button>
            </div>
        </div>
    </div>
</div>
