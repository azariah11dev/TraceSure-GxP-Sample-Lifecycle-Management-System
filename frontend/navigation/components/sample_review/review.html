<div class="sample-review-component">
    <h1 class="sample-review-component-header">Sample Review</h1>
    <div class="sample-review-component-table">
        <table id="sample-review-table">
            <thead>
                <tr>
                    <th>Sample Name</th>
                    <th>Status</th>
                    <th>Performed By</th>
                    <th>Number of Tests</th>
                    <th>Open Deviation</th>
                    <th>Creation Date</th>
                    <th>Review</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <div class="sample-review-component-test-details hidden" id="sample-review-component-test-details">
        <h2 id="sample-review-component-test-details-title" style="margin-bottom: 20px;"></h2>
        <div class="sample-review-component-table">
            <table id="sample-review">
                <thead>
                    <tr>
                        <th>Test Name</th>
                        <th>Performed By</th>
                        <th>Test Result</th>
                        <th>Spec Upper Limit</th>
                        <th>Spec Lower Limit</th>
                        <th>Units</th>
                        <th>Status</th>
                        <th>Review</th>
                        <th>Submit Data</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
            <div style="display: flex; justify-content: center; align-items: center; width:100%; margin-top: 20px;">
                <button id="close-test-review-details">
                    Close Test Details
                </button>
            </div>
        </div>
    </div>
</div>
